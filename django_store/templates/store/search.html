{% extends 'base.html' %}

{% block content %}
<h1>Результаты поиска: "{{ query }}"</h1>
{% if products %}
    <div class="product-grid" style="margin-top: 2rem;">
        {% for product in products %}
            {% include 'store/includes/product_card.html' %}
        {% endfor %}
    </div>
{% else %}
    <p style="margin-top: 2rem;">К сожалению, по вашему запросу ничего не найдено.</p>
{% endif %}
{% endblock %}
